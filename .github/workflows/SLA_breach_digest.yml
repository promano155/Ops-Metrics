name: SLA breach digest

on:
  # Dispatched externally via cron-job.org hitting the workflow_dispatch
  # endpoint - same pattern as the rest of the repo's workflows. No
  # native `schedule:` trigger here on purpose: a schedule block that
  # never actually fires is exactly the kind of stale config that's
  # easy to mistake for "the real schedule" when debugging later.
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run — build digest but DO NOT post to Slack"
        required: false
        type: boolean
        default: true

jobs:
  digest:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Run SLA Breach Digest
        env:
          ASANA_PAT: ${{ secrets.ASANA_PAT }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}

        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.dry_run }}" = "true" ]; then
            python sla_breach_digest.py --dry-run
          else
            python sla_breach_digest.py
          fi
