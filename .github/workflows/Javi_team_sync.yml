# Move this file to .github/workflows/data-processing-sync.yml in your repo.
name: Sync Javi team metrics

on:
  schedule:
    # 13:00 UTC daily (adjust for your team's morning). GitHub Actions cron
    # can run a few minutes late, which is fine for a daily rollup.
    - cron: "0 13 * * *"
  workflow_dispatch:
    inputs:
      yellow_row_args:
        description: 'Extra args for the yellow-row script, e.g. --list-colors or --dry-run --month 2026-06'
        required: false
        default: ''
      skip_yellow_row:
        description: 'Skip the yellow-row Asana step entirely (use this for manual/backfill runs of the other scripts, so real tickets and channel pings do not fire off-schedule)'
        required: false
        type: boolean
        default: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install gspread google-auth requests

      - name: Run data processing sync
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: python sync_data_processing_metrics.py

      - name: Run HubSpot ticket sync
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          HUBSPOT_PRIVATE_APP_TOKEN: ${{ secrets.HUBSPOT_PRIVATE_APP_TOKEN }}
        run: python sync_hubspot_ticket_metrics.py

      - name: Run HubSpot ticket SLA sync
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          HUBSPOT_PRIVATE_APP_TOKEN: ${{ secrets.HUBSPOT_PRIVATE_APP_TOKEN }}
        run: python sync_hubspot_ticket_sla.py

      - name: Run yellow-row Asana sync
        if: ${{ github.event.inputs.skip_yellow_row != 'true' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          ASANA_PAT: ${{ secrets.ASANA_PAT }}
        run: python sync_yellow_rows_to_asana.py ${{ github.event.inputs.yellow_row_args }}
