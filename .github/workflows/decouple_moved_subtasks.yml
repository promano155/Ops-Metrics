name: Decouple moved subtasks

on:
  schedule:
    # 12:00 UTC daily. Own lean, single-purpose job.
    - cron: "0 12 * * *"
  workflow_dispatch:
    inputs:
      run_for_real:
        description: 'Force a REAL run right now (actually detach tasks), regardless of the AUTO_DECOUPLE repo variable'
        required: false
        type: boolean
        default: false

jobs:
  decouple:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Run decouple check
        env:
          ASANA_PAT: ${{ secrets.ASANA_PAT }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          AUTO_DECOUPLE: ${{ (github.event.inputs.run_for_real == 'true') && 'true' || vars.AUTO_DECOUPLE }}
        run: python decouple_moved_subtasks.py
