name: Weekly completions digest

on:
  schedule:
    # 12:00 UTC daily. Own lean, single-purpose job, separate from the
    # main billing pipeline's schedule.
    - cron: "0 12 * * *"
  workflow_dispatch:
    inputs:
      list_completed:
        description: 'One-time: include hotel/task names completed this week in the Slack message'
        required: false
        type: boolean
        default: false

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Run weekly completions digest
        env:
          ASANA_PAT: ${{ secrets.ASANA_PAT }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
        run: |
          if [ "${{ github.event.inputs.list_completed }}" = "true" ]; then
            python weekly_completions_digest.py --list-completed
          else
            python weekly_completions_digest.py
          fi
